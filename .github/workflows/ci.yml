name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dataforge
          POSTGRES_USER: dataforge
          POSTGRES_PASSWORD: dataforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataforge -d dataforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://dataforge:dataforge@localhost:5432/dataforge
      JWT_SECRET_KEY: ci-only-secret-not-for-deployment
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app alembic tests
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q

  containers:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t dataforge-api:ci .
      - run: docker build --build-arg NEXT_PUBLIC_API_URL=https://api.example.invalid -f frontend/Dockerfile -t dataforge-frontend:ci .